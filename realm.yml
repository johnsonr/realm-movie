name: movie
description: |
  Movie recommendations grounded in what the user has rated, what's actually
  streamable in their country, and live OMDb metadata. Ships three short
  Agent Skills — `recommend-movie` (pick something to watch / where can I
  stream X), `rate-movie` (record a rating), `recall-movies` (read prior
  ratings) — backed by the `Movie` and `MovieRating` types so ratings
  persist into the world graph and feed back into future
  recommendations. A real `MovieWatchlistEntry` node and `WANTS_TO_SEE`
  edge hold each user's saved films. The bundled `roger` personality gives the
  recommendation write-up a Roger-Ebert voice. The Picture Palace app
  (`apps/the-picture-palace.html`) is the same ground seen rather than
  asked for: search the films you've rated, follow "more like this" into
  unseen ones, see where each streams, read the taste summary the
  ratings add up to, and find newly released films matching that taste
  via live web search — under a choice of cinema themes.
