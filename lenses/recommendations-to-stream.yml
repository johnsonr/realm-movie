# Top recommendations WITH streaming — taste-anchored, each tagged with which of YOUR streaming
# services (SUBSCRIBES_TO, from reference data) has it now, in your country (AVAILABLE_ON — the
# Streaming Availability producer). Anchored on the MovieTasteSummary chain (fan-IN over your ratings,
# then SUGGESTS fan-OUT), not per-film similars. OPTIONAL MATCH, not MATCH: most films won't be on
# your services, so all recommendations show and the streamable ones are tagged + floated to the top
# ("all recs, tag streamable ones"). AVAILABLE_ON's StreamingService.serviceId intersects the user's
# UserStreamingSubscription.serviceId.
id: recommendations-to-stream
name: Recommendations You Can Stream
description: Films matching your taste, tagged with which of your streaming services have them now.
spec:
  kind: cypherscript
  script: |
    const { rows } = await gateway.kg.query({
      cypher: `MATCH (me:AssistantUser)-[:HAS_MOVIE_TASTE_SUMMARY]->(ts:MovieTasteSummary)
               MATCH (ts)-[:SUGGESTS]->(m:Movie)
               WHERE NOT EXISTS { (me)-[:RATED]->(seen:MovieRating) WHERE seen.imdbId = m.imdbId }
               OPTIONAL MATCH (m)-[:AVAILABLE_ON]->(s:StreamingService)
                 WHERE EXISTS { (me)-[:SUBSCRIBES_TO]->(:UserStreamingSubscription {serviceId: s.serviceId}) }
               WITH m, collect(DISTINCT s.serviceName) AS onYourServices
               RETURN m.title AS title, m.year AS year, m.genre AS genre, m.director AS director,
                      onYourServices
               ORDER BY size(onYourServices) DESC,
                        coalesce(toFloat(toString(m.imdbRating)), 0.0) DESC, m.title ASC
               LIMIT 12`,
      params: JSON.stringify({}),
    });
    await gateway.lens.present({ content: JSON.stringify({
      kind: "movie-recommendations",
      title: "Recommended — streamable ones tagged",
      movies: rows,
    }) });
