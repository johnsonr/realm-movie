# A small global starter catalogue for graph queries, keyed by the SAME ids returned by Streaming
# Availability. The Picture Palace loads its country-specific checklist live from `/countries`.
# Per-user subscriptions are deliberately NOT seeded: users check their own services in the app,
# which persists UserStreamingSubscription nodes anchored by SUBSCRIBES_TO.

# --- catalog (global) ---
- type: StreamingService
  data: { serviceId: netflix, serviceName: Netflix }
- type: StreamingService
  data: { serviceId: stan, serviceName: Stan }
- type: StreamingService
  data: { serviceId: disney, serviceName: "Disney+" }
- type: StreamingService
  data: { serviceId: prime, serviceName: "Prime Video" }
- type: StreamingService
  data: { serviceId: apple, serviceName: "Apple TV+" }
